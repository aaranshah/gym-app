<title>Forge Training Log</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#101215">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap">
<style>
/* Layout: single-column phone app. Sticky date header, scrolling day log, fixed tab bar.
   Section colours follow bumper-plate coding: red 25 kg = training, blue 20 kg = sleep,
   green 10 kg = food, yellow 15 kg = chalk/timer accent. */
:root{
  --bg:#eef0f3; --surface:#ffffff; --surface-2:#e4e7ec; --line:#d3d7de; --fg:#14171b; --muted:#59616d;
  --train:#c9353a; --sleep:#2559cf; --food:#167548; --chalk:#e0a80d; --on-chalk:#1a1812; --on-color:#ffffff;
  --shadow:0 1px 2px rgba(16,20,28,.06),0 6px 20px rgba(16,20,28,.06);
  --display:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:14px; --tabh:62px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0f1114; --surface:#171a1f; --surface-2:#21252b; --line:#2b3037; --fg:#eceef1; --muted:#9299a4;
  --train:#ef5a5e; --sleep:#5d8dff; --food:#3dbb7c; --chalk:#f2c230; --on-chalk:#16140d; --on-color:#0f1114;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#0f1114; --surface:#171a1f; --surface-2:#21252b; --line:#2b3037; --fg:#eceef1; --muted:#9299a4;
  --train:#ef5a5e; --sleep:#5d8dff; --food:#3dbb7c; --chalk:#f2c230; --on-chalk:#16140d; --on-color:#0f1114;
  --shadow:0 1px 0 rgba(255,255,255,.03),0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }

*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body.locked{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--chalk);outline-offset:2px}
.num,.tab-num{font-variant-numeric:tabular-nums}

.wrap{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top-row{display:flex;align-items:center;gap:10px;padding-block:10px 6px}
.brand{font-family:var(--display);font-weight:700;letter-spacing:.14em;font-size:13px;color:var(--muted);text-transform:uppercase}
.top-title{font-family:var(--display);font-weight:700;font-size:26px;line-height:1;text-transform:uppercase;letter-spacing:.02em;flex:1}
.sync{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:block}
.sync.ok i{background:var(--food)} .sync.warn i{background:var(--chalk)} .sync.err i{background:var(--train)}
.icon-btn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--fg)}
.icon-btn:active{background:var(--surface-2)}
.icon-btn svg{width:22px;height:22px}
.datebar{display:flex;align-items:center;gap:6px;padding-block:0 10px}
.datebar .lbl{flex:1;text-align:center;font-weight:600}
.datebar .lbl small{display:block;font-size:12px;color:var(--muted);font-weight:500}

main{padding-block:14px 170px;display:flex;flex-direction:column;gap:14px}
svg.i{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.card{background:var(--surface);border-radius:var(--r);padding:14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-family:var(--display);font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:.03em;line-height:1.1}
.card .sub{color:var(--muted);font-size:13px}
.eyebrow{font-size:11.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap-ok{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.sec-title{font-family:var(--display);font-weight:700;text-transform:uppercase;letter-spacing:.06em;font-size:15px;color:var(--muted);margin:6px 2px -4px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;font-weight:600;background:var(--surface-2);color:var(--fg)}
.btn:active{transform:scale(.98)}
.btn.block{width:100%}
.btn.train{background:var(--train);color:var(--on-color)}
.btn.sleep{background:var(--sleep);color:var(--on-color)}
.btn.food{background:var(--food);color:var(--on-color)}
.btn.chalk{background:var(--chalk);color:var(--on-chalk)}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.sm{min-height:34px;padding:0 12px;font-size:14px;border-radius:10px}
.btn.danger{color:var(--train)}
.btn[disabled]{opacity:.5;pointer-events:none}
.link{color:var(--muted);font-weight:600;font-size:14px;text-decoration:underline;text-underline-offset:3px}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12.5px;font-weight:600;color:var(--muted)}
.inp,select.inp,textarea.inp{width:100%;min-height:44px;border-radius:11px;border:1px solid var(--line);background:var(--bg);padding:8px 12px;font-size:16px}
textarea.inp{min-height:80px;resize:vertical}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}

.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;margin-inline:-2px;padding-inline:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:34px;padding:0 13px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:14px;white-space:nowrap}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}

/* stat tiles */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--surface-2);border-radius:11px;padding:8px 10px;min-width:0}
.stat b{display:block;font-family:var(--display);font-size:22px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.stat span{font-size:11.5px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}

/* train */
.wo-card{border-left:4px solid var(--train)}
.ex-card{gap:8px}
.ex-head{display:flex;align-items:flex-start;gap:8px}
.ex-name{font-weight:700;font-size:16.5px;color:var(--train);text-align:left;line-height:1.2}
.ex-meta{font-size:12.5px;color:var(--muted)}
.rest-chip{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;color:var(--muted);background:var(--surface-2);border-radius:8px;padding:4px 8px;border:0}
.rest-chip select{background:transparent;border:0;font-weight:700;color:var(--fg);font-size:13px;padding:0}
.sets{display:flex;flex-direction:column;gap:4px}
.set-row{display:grid;grid-template-columns:34px minmax(0,1fr) repeat(var(--n),62px) 40px;gap:6px;align-items:center;border-radius:10px;padding:3px 2px}
.set-row.head{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-block:0}
.set-row.head>*{text-align:center}
.set-row.head>:nth-child(2){text-align:left}
.set-row.done{background:color-mix(in oklab,var(--food) 16%,transparent)}
.set-k{height:32px;border-radius:8px;font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2)}
.set-k.k-w{color:var(--chalk)} .set-k.k-d{color:var(--sleep)} .set-k.k-f{color:var(--train)}
.prev{font-size:13px;color:var(--muted);text-align:left;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;height:32px}
.set-in{width:100%;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--bg);text-align:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums;padding:0 4px}
.set-in::placeholder{color:var(--muted);opacity:.65;font-weight:600}
.set-row.done .set-in{background:transparent;border-color:transparent}
.chk{height:34px;border-radius:9px;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.set-row.done .chk{background:var(--food);color:var(--on-color)}
.chk svg{width:18px;height:18px}
.ex-note{border:0;background:transparent;font-size:14px;color:var(--muted);padding:2px 0;width:100%}

/* timer bar */
#timerbar{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:25;padding-left:max(12px,env(safe-area-inset-left,0px));padding-right:max(12px,env(safe-area-inset-right,0px));padding-bottom:8px}
.tb{max-width:616px;margin:0 auto;background:var(--chalk);color:var(--on-chalk);border-radius:16px;padding:8px 8px 8px 14px;display:flex;align-items:center;gap:8px;position:relative;overflow:hidden;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.tb .prog{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.12);pointer-events:none}
.tb .t{font-family:var(--display);font-weight:700;font-size:30px;line-height:1;font-variant-numeric:tabular-nums;position:relative}
.tb .lab{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;position:relative;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tb button{position:relative;min-height:38px;min-width:44px;padding:0 10px;border-radius:10px;background:rgba(0,0,0,.12);font-weight:700;color:inherit}
.tb.over{background:var(--food);color:var(--on-color)}

/* tabs */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:26;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tabh)}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11.5px;font-weight:700;color:var(--muted);letter-spacing:.03em;position:relative}
.tab svg{width:23px;height:23px}
.tab.on{color:var(--fg)}
.tab.on::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--c)}

/* sheets */
#sheet{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;justify-content:flex-end}
.scrim{position:absolute;inset:0;background:rgba(5,7,10,.5)}
.sheet{position:relative;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet.full{height:calc(100% - env(safe-area-inset-top,0px) - 12px);max-height:none}
.sh-head{display:flex;align-items:center;gap:8px;padding:12px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--line)}
.sh-head h2{flex:1;margin:0;font-family:var(--display);font-size:21px;text-transform:uppercase;letter-spacing:.03em;text-align:center}
.sh-body{min-height:0;overflow-y:auto;padding:14px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:12px;-webkit-overflow-scrolling:touch;flex:1}
.sh-tool{padding:10px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 2px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .ttl{font-weight:600}
.li .mt{font-size:12.5px;color:var(--muted)}
.li .tick{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.li.sel .tick{background:var(--train);border-color:var(--train);color:var(--on-color)}
.li .tick svg{width:15px;height:15px}
.gl{font-size:12px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:12px 2px 2px;text-transform:uppercase}
.ex-av{width:38px;height:38px;border-radius:10px;background:var(--surface-2);flex:none;display:grid;place-items:center;font-family:var(--display);font-weight:700;color:var(--muted);font-size:14px}

/* sleep */
.score{display:flex;align-items:center;gap:16px}
.ring{width:118px;height:118px;flex:none;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .v{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .v b{font-family:var(--display);font-size:42px;line-height:.9;font-variant-numeric:tabular-nums}
.ring .v small{display:block;font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.bar{height:8px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:5px;background:var(--c,var(--sleep))}
.brk{display:grid;grid-template-columns:1fr auto;gap:3px 10px;align-items:center;font-size:13.5px}
.brk .bar{grid-column:1/-1;margin-bottom:6px}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body);font-weight:600}
.rated{display:flex;gap:6px}
.rated button{flex:1;min-height:40px;border-radius:10px;background:var(--surface-2);font-weight:700}
.rated button.on{background:var(--sleep);color:var(--on-color)}

/* food */
.eq{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;align-items:end;text-align:center;gap:4px}
.eq b{font-family:var(--display);font-size:24px;font-weight:700;display:block;line-height:1;font-variant-numeric:tabular-nums}
.eq span{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.eq .op{font-family:var(--display);font-size:22px;color:var(--muted);padding-bottom:12px}
.eq .rem b{color:var(--food)} .eq .rem.over b{color:var(--train)}
.macros{display:grid;grid-template-columns:repeat(2,1fr);gap:10px 14px}
.mac .top{display:flex;justify-content:space-between;font-size:13px;font-weight:600;margin-bottom:4px}
.mac .top span:last-child{color:var(--muted);font-variant-numeric:tabular-nums}
.meal-head{display:flex;align-items:center;gap:8px}
.meal-head h3{flex:1}
.meal-kcal{font-family:var(--display);font-weight:700;font-size:18px;font-variant-numeric:tabular-nums}
.fi{display:flex;align-items:center;gap:10px;padding:8px 0;border-top:1px solid var(--line);text-align:left;width:100%}
.fi .grow div:first-child{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fi .k{font-weight:700;font-variant-numeric:tabular-nums}
.glasses{display:flex;gap:4px;flex-wrap:wrap}
.glass{width:30px;height:36px;border-radius:4px 4px 9px 9px;border:2px solid var(--line);position:relative;overflow:hidden}
.glass.on{border-color:var(--sleep)}
.glass.on::after{content:"";position:absolute;inset:30% 0 0;background:color-mix(in oklab,var(--sleep) 55%,transparent)}
.ai-box{border:1px dashed var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}

/* calendar */
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal-dow{font-size:11px;font-weight:700;color:var(--muted);text-align:center;letter-spacing:.06em;padding-bottom:2px}
.cday{aspect-ratio:1/1.12;max-width:100%;border-radius:10px;background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:5px 3px 6px;font-weight:700;font-variant-numeric:tabular-nums;font-size:14px;min-width:0}
.cday.out{background:transparent;color:var(--muted);opacity:.45}
.cday.today{box-shadow:inset 0 0 0 2px var(--fg)}
.cday.sel{background:var(--fg);color:var(--bg)}
.marks{display:flex;gap:2px;width:100%;justify-content:center}
.marks i{height:5px;flex:0 1 9px;border-radius:3px;background:transparent}
.marks i.t{background:var(--train)} .marks i.s{background:var(--sleep)} .marks i.f{background:var(--food)}
.marks i.half{opacity:.4}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:5px;border-radius:3px;display:inline-block}
.sum-line{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.sum-line .dot{width:10px;height:10px;border-radius:3px;margin-top:5px;flex:none}

/* coach */
.msgs{display:flex;flex-direction:column;gap:10px}
.msg{max-width:88%;padding:10px 13px;border-radius:16px;line-height:1.45;font-size:15px;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--fg);color:var(--bg);border-bottom-right-radius:5px;white-space:pre-wrap}
.msg.a{align-self:flex-start;background:var(--surface);box-shadow:var(--shadow);border-bottom-left-radius:5px}
.msg.a p{margin:0 0 8px} .msg.a p:last-child{margin-bottom:0}
.msg.a ul,.msg.a ol{margin:0 0 8px;padding-left:20px}
.msg.a li{margin:2px 0}
.msg.a h4{margin:8px 0 4px;font-family:var(--display);font-size:17px;text-transform:uppercase;letter-spacing:.03em}
.msg.a code{background:var(--surface-2);padding:1px 5px;border-radius:5px;font-size:13px}
.msg.err{color:var(--train)}
.composer{position:sticky;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 8px);display:flex;gap:8px;align-items:flex-end;background:var(--surface);border-radius:16px;padding:8px;box-shadow:var(--shadow);border:1px solid var(--line)}
.composer textarea{flex:1;border:0;background:transparent;resize:none;min-height:40px;max-height:140px;padding:9px 6px;font-size:16px}
.composer textarea:focus{outline:none}
.thinking{display:inline-flex;gap:4px}
.thinking i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:blink 1.2s infinite}
.thinking i:nth-child(2){animation-delay:.2s}.thinking i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px) + 76px);z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;font-size:14px;max-width:calc(100% - 32px);box-shadow:0 8px 24px rgba(0,0,0,.25);text-align:center}
.empty{text-align:center;padding:18px 8px;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-family:var(--display);font-size:20px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:4px}
details summary{cursor:pointer;font-weight:600}
details p{margin:8px 0 0;color:var(--muted);font-size:13.5px}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:520px){ .macros{grid-template-columns:repeat(4,1fr)} }
</style>

<header class="top" id="hdr"></header>
<main class="wrap" id="view" aria-live="polite"></main>
<div id="timerbar" hidden></div>
<nav class="tabs" id="tabs" aria-label="Sections"></nav>
<div id="sheet" hidden></div>
<div id="toast" hidden role="status"></div>

<script>
"use strict";
/* ============================== helpers ============================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, "0");
const dkey = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseKey = k => { const [y, m, d] = k.split("-").map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return dkey(d); };
const todayKey = () => dkey(new Date());
const slug = s => s.toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
const fmtInt = n => Math.round(n || 0).toLocaleString();
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const toMin = t => { if (!t) return null; const [h, m] = t.split(":").map(Number); return h * 60 + m; };
const fmtHM = mins => { mins = Math.round(mins); return `${Math.floor(mins / 60)}h ${pad(mins % 60)}m`; };
const fmtClock = sec => { sec = Math.max(0, Math.ceil(sec)); return `${Math.floor(sec / 60)}:${pad(sec % 60)}`; };
const stable = v => JSON.stringify(v, (k, val) => (val && typeof val === "object" && !Array.isArray(val)) ? Object.keys(val).sort().reduce((o, key) => (o[key] = val[key], o), {}) : val);

const relDay = k => { const t = todayKey(); if (k === t) return "Today"; if (k === addDays(t, -1)) return "Yesterday"; if (k === addDays(t, 1)) return "Tomorrow"; return String(parseKey(k).getFullYear()); };

  const inline = s => s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/(^|[\s(])\*(?!\s)([^*]+?)\*/g, "$1<i>$2</i>").replace(/`([^`]+)`/g, "<code>$1</code>");

    ${hist.length ? `<div class="list">${hist.slice(0, 25).map(h => `<div class="li"><span class="grow"><div class="ttl">${prettyDate(h.k)} ${parseKey(h.k).getFullYear()}</div><div class="mt">${h.sets.map(st => esc(fmtSet(h.type, st))).join(" · ")}</div></span></div>`).join("")}</div>` : `<div class="empty"><b>No history yet</b>Complete a set of this exercise and it will show here.</div>`}
    <div class="small muted">${esc(GROUPS[e?.group] || "Custom")} · ${esc(e?.equip || "")}. Est. 1RM uses the Epley formula.</div>`;
  return { title: e?.name || "History", body };
}

/* ============================== actions ============================== */
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2600); }
const num = id => { const v = $(id)?.value?.trim().replace(",", "."); return v === "" || v == null || isNaN(+v) ? null : +v; };

document.addEventListener("click", e => {
  const b = e.target.closest("[data-act]"); if (!b || b.disabled) return;
  unlockAudio();
  const a = b.dataset.act, s = ui.sheet;
  const wo = openWO();
  const rowEl = b.closest(".set-row");
  const exAt = i => wo?.exercises[+i];
  switch (a) {
    case "tab": ui.tab = b.dataset.tab; ui.confirmDel = null; saveUI(); render(); window.scrollTo(0, 0); break;
    case "day": ui.date = addDays(ui.date, +b.dataset.d); render(); break;
    case "today": ui.date = todayKey(); render(); break;
    case "settings": openSheet({ type: "settings" }); break;
    case "sheet-close": if (s?.back) { s.back.q = s.back.q || ""; openSheet(s.back); } else { closeSheet(); if (pendingRender) render(); } break;
    case "timer-adj": adjustTimer(+b.dataset.d); break;
    case "timer-stop": stopTimer(); break;
    case "quick-timer": openSheet({ type: "timer" }); break;
    case "timer-go": startTimer(+b.dataset.s, "Rest"); closeSheet(); break;

    // training
    case "start-empty": startWorkout(); break;
    case "start-starter": startStarter(STARTERS.find(x => x.id === b.dataset.id)); break;
    case "start-routine": startRoutine(S.routines.find(x => x.id === b.dataset.id)); break;
    case "del-routine": S.routines = S.routines.filter(x => x.id !== b.dataset.id); saveProfile(); render(); toast("Routine deleted"); break;
    case "open-wo": ui.open = { date: ui.date, id: b.dataset.id }; saveUI(); render(); window.scrollTo(0, 0); break;
    case "close-wo": ui.open = null; ui.confirmDel = null; saveUI(); render(); break;
    case "browse-ex": openSheet({ type: "picker", browse: true, g: "all", eq: "all", q: "", sel: [] }); break;
    case "add-ex": openSheet({ type: "picker", g: "all", eq: "all", q: "", sel: [] }); break;
    case "pick-g": s.g = b.dataset.g; renderSheet(); break;
    case "pick-toggle": {
      const id = b.dataset.id;
      if (s.replace != null) { const e2 = exById(id), ex = exAt(s.replace); Object.assign(ex, { exId: e2.id, name: e2.name, type: e2.type }); saveDay(ui.open.date); closeSheet(); render(); break; }
      s.sel = s.sel.includes(id) ? s.sel.filter(x => x !== id) : [...s.sel, id];
      b.classList.toggle("sel"); b.querySelector(".tick").innerHTML = s.sel.includes(id) ? ICON.check : "";
      const add = document.querySelector('[data-act="pick-add"]'); if (add) { add.disabled = !s.sel.length; add.textContent = `Add${s.sel.length ? ` (${s.sel.length})` : ""}`; }
      break;
    }
    case "pick-add": if (wo) { s.sel.forEach(id => { const e2 = exById(id); if (e2) wo.exercises.push(makeEx(e2, 3)); }); saveDay(ui.open.date); } closeSheet(); render(); break;
    case "pick-history": openSheet({ type: "history", id: b.dataset.id, back: s }); break;
    case "ex-history": openSheet({ type: "history", id: b.dataset.id }); break;
    case "custom-ex": openSheet({ type: "custom", back: s }); break;
    case "custom-save": {
      const name = $("#cx-name").value.trim(); if (!name) { toast("Give the exercise a name"); break; }
      const ce = { id: "c-" + uid(), name, group: $("#cx-g").value, equip: $("#cx-eq").value, type: $("#cx-t").value, custom: true };
      S.customEx.push(ce); saveProfile();
      const back = s.back || { type: "picker", g: "all", eq: "all", q: "", sel: [] };
      if (!back.browse) back.sel = [...(back.sel || []), ce.id];
      back.q = ""; openSheet(back); toast("Exercise created");
      break;
    }
    case "ex-menu": openSheet({ type: "exmenu", i: +b.dataset.exi }); break;
    case "exm": {
      const i = s.i, ex = exAt(i); if (!ex) break;
      const op = b.dataset.op;
      if (op === "history") { openSheet({ type: "history", id: ex.exId }); break; }
      if (op === "replace") { openSheet({ type: "picker", g: exById(ex.exId)?.group || "all", eq: "all", q: "", sel: [], replace: i }); break; }
      if (op === "up" && i > 0) [wo.exercises[i - 1], wo.exercises[i]] = [wo.exercises[i], wo.exercises[i - 1]];
      if (op === "down" && i < wo.exercises.length - 1) [wo.exercises[i + 1], wo.exercises[i]] = [wo.exercises[i], wo.exercises[i + 1]];
      if (op === "dropset") ex.sets.pop();
      if (op === "remove") wo.exercises.splice(i, 1);
      saveDay(ui.open.date); closeSheet(); render();
      break;
    }
    case "add-set": { const ex = exAt(b.dataset.exi); ex.sets.push(newSet(ex.sets[ex.sets.length - 1])); ex.sets[ex.sets.length - 1].done = false; saveDay(ui.open.date); render(); break; }
    case "set-kind": {
      const ex = exAt(rowEl.dataset.ex), st = ex.sets[+rowEl.dataset.set];
      st.k = { n: "w", w: "d", d: "f", f: "n" }[st.k || "n"]; saveDay(ui.open.date); render(); break;
    }
    case "use-prev": {
      const ex = exAt(rowEl.dataset.ex), j = +rowEl.dataset.set, p = (lastPerformance(ex.exId, ui.open.date, wo.id) || [])[j]; if (!p) break;
      Object.assign(ex.sets[j], { w: p.w ?? null, r: p.r ?? null, t: p.t ?? null, d: p.d ?? null, m: p.m ?? null }); saveDay(ui.open.date); render(); break;
    }
    case "set-done": {
      const ex = exAt(rowEl.dataset.ex), j = +rowEl.dataset.set, st = ex.sets[j];
      st.done = !st.done;
      if (st.done) {
        // tick with empty boxes = use the greyed-out suggestion (previous session or target)
        rowEl.querySelectorAll(".set-in").forEach(inp => {
          const f = inp.dataset.f;
          if (st[f] == null && inp.placeholder !== "") { const v = +String(inp.placeholder).replace(",", "."); if (!isNaN(v)) st[f] = f === "w" ? wStore(v) : v; }
        });
        if (+ex.rest) startTimer(+ex.rest, `Rest · ${ex.name}`);
      }
      saveDay(ui.open.date); render(); break;
    }
    case "finish-wo": {
      wo.end = Date.now();
      wo.exercises.forEach(ex => { ex.sets = ex.sets.filter(st => st.done || st.w != null || st.r != null || st.t != null || st.d != null); });
      wo.exercises = wo.exercises.filter(ex => ex.sets.length);
      wo.dur = Math.max(1, Math.round((wo.end - wo.start) / 60000));
      const k = ui.open.date, d = day(k);
      if (!wo.exercises.length) { d.workouts = d.workouts.filter(w => w.id !== wo.id); toast("Empty workout discarded"); }
      else toast(`Workout saved · ${woSets(wo)} sets · ${fmtInt(wDisp(woVolume(wo)))} ${unit()}`);
      saveDay(k); ui.open = null; saveUI(); stopTimer(); render(); window.scrollTo(0, 0);
      break;
    }
    case "del-wo": ui.confirmDel = wo.id; render(); break;
    case "del-wo-no": ui.confirmDel = null; render(); break;
    case "del-wo-yes": { const k = ui.open.date, d = day(k); d.workouts = d.workouts.filter(w => w.id !== wo.id); saveDay(k); ui.open = null; ui.confirmDel = null; saveUI(); render(); toast("Workout deleted"); break; }
    case "save-routine": openSheet({ type: "routine" }); break;
    case "routine-save": {
      const name = $("#rt-name").value.trim() || wo.name;
      S.routines.push({ id: uid(), name, exercises: wo.exercises.map(ex => ({ exId: ex.exId, name: ex.name, type: ex.type, rest: ex.rest, target: ex.target || "", sets: ex.sets.filter(x => x.k !== "w").length || ex.sets.length })) });
      saveProfile(); closeSheet(); toast("Routine saved"); break;
    }

    // sleep
    case "sl-rate": ui.rested = +b.dataset.v; document.querySelectorAll('[data-act="sl-rate"]').forEach(x => x.classList.toggle("on", x === b)); break;
    case "sl-save": {
      const bed = $("#sl-bed").value, wake = $("#sl-wake").value; if (!bed || !wake) { toast("Enter both times"); break; }
      const d = day(ui.date); d.sleep = { bed, wake, lat: +$("#sl-lat").value, rested: ui.rested ?? d.sleep?.rested ?? null };
      ui.rested = null; saveDay(ui.date); render(); toast(`Sleep score ${sleepCalc(ui.date).score}`); break;
    }
    case "sl-del": day(ui.date).sleep = null; saveDay(ui.date); render(); break;

    // food
    case "food-add": openSheet({ type: "addfood", meal: b.dataset.meal, mode: "search", q: "" }); break;
    case "food-mode": s.mode = b.dataset.m; s.pick = null; renderSheet(); break;
    case "food-pick": { const id = b.dataset.id; const f = S.customFoods.find(x => x.id === id) || FOODDB.find(x => x.id === id); s.pick = f; s.g = f.g; renderSheet(); break; }
    case "food-unpick": s.pick = null; renderSheet(); break;
    case "food-x": s.g = Math.round(s.pick.g * +b.dataset.x); renderSheet(); break;
    case "food-add-pick": {
      const g = num("#food-g"); if (!g) { toast("Enter an amount"); break; }
      const v = scale(s.pick.per, g);
      addFood({ name: s.pick.name, g, per: s.pick.per, ...v }, $("#food-meal").value); break;
    }
    case "food-recent": { const it = recentFoods()[+b.dataset.i]; const { id, meal, ...rest } = it; addFood(rest, $("#food-meal").value); break; }
    case "qa-add": {
      const name = $("#qa-name").value.trim() || "Quick add", kcal = num("#qa-kcal"); if (kcal == null) { toast("Enter calories"); break; }
      const it = { name, kcal, p: num("#qa-p") || 0, c: num("#qa-c") || 0, f: num("#qa-f") || 0, fib: num("#qa-fib") || 0 }, g = num("#qa-g");
      if (g) { it.g = g; it.per = { kcal: kcal / g * 100, p: it.p / g * 100, c: it.c / g * 100, f: it.f / g * 100, fib: it.fib / g * 100 }; }
      if ($("#qa-save").checked && g) { S.customFoods.unshift({ id: "cf-" + uid(), name, g, label: "", per: it.per }); saveProfile(); }
      addFood(it, $("#food-meal").value); break;
    }
    case "ai-estimate": aiEstimate(); break;
    case "ai-toggle": s.items[+b.dataset.i].on = !s.items[+b.dataset.i].on; renderSheet(); break;
    case "ai-add": {
      const meal = $("#food-meal").value, d = day(ui.date);
      s.items.filter(i => i.on).forEach(i => d.food.push({ id: uid(), meal, name: i.name, g: i.grams || null, per: i.grams ? { kcal: i.kcal / i.grams * 100, p: i.p / i.grams * 100, c: i.c / i.grams * 100, f: i.f / i.grams * 100, fib: i.fib / i.grams * 100 } : undefined, kcal: i.kcal, p: i.p, c: i.c, f: i.f, fib: i.fib }));
      saveDay(ui.date); closeSheet(); render(); toast("Added to your diary"); break;
    }
    case "food-edit": openSheet({ type: "foodedit", id: b.dataset.id }); break;
    case "fe-save": {
      const d = day(ui.date), it = d.food.find(x => x.id === s.id);
      if (it.per) { const g = num("#fe-g"); if (g) Object.assign(it, { g }, scale(it.per, g)); }
      else Object.assign(it, { kcal: num("#fe-kcal") || 0, p: num("#fe-p") || 0, c: num("#fe-c") || 0, f: num("#fe-f") || 0 });
      it.meal = $("#fe-meal").value; saveDay(ui.date); closeSheet(); render(); break;
    }
    case "fe-del": { const d = day(ui.date); d.food = d.food.filter(x => x.id !== s.id); saveDay(ui.date); closeSheet(); render(); break; }
    case "water": { const d = day(ui.date), n = +b.dataset.n * 250; d.water = d.water === n ? n - 250 : n; saveDay(ui.date); render(); break; }

    // profile & targets
    case "profile": openSheet({ type: "profile" }); break;
    case "pf-save": {
      const p = S.profile;
      Object.assign(p, { age: num("#pf-age"), sex: $("#pf-sex").value, heightCm: num("#pf-h"), weightKg: wStore($("#pf-w").value.trim().replace(",", ".")), bodyFat: num("#pf-bf"), trainDays: num("#pf-td"), activity: +$("#pf-act").value, goal: $("#pf-goal").value });
      saveProfile(); renderSheet(); render(); toast(calcTargets() ? `Target: ${fmtInt(targets().kcal)} kcal · ${targets().p} g protein` : "Saved. Add age, height and weight to calculate targets."); break;
    }
    case "tg-use-calc": S.targets = null; saveProfile(); renderSheet(); render(); break;
    case "tg-custom": s.custom = !(s.custom ?? (S.targets?.source === "custom")); renderSheet(); break;
    case "tg-save": {
      const T = { kcal: num("#tg-kcal"), p: num("#tg-p"), c: num("#tg-c"), f: num("#tg-f"), fib: num("#tg-fib"), water: num("#tg-water"), source: "custom" };
      if (!T.kcal) { toast("Enter at least calories"); break; }
      S.targets = T; saveProfile(); renderSheet(); render(); toast("Custom targets saved"); break;
    }
    case "ai-targets": aiTargets(); break;
    case "ai-targets-use": S.targets = { ...s.ai, source: "coach" }; s.ai = null; saveProfile(); renderSheet(); render(); toast("Coach targets in use"); break;

    // calendar
    case "cal-m": { const base = ui.calMonth || monthOf(ui.date); const [y, m] = base.split("-").map(Number); const d2 = new Date(y, m - 1 + +b.dataset.d, 1); ui.calMonth = `${d2.getFullYear()}-${pad(d2.getMonth() + 1)}`; render(); break; }
    case "cal-day": ui.date = b.dataset.k; ui.calMonth = monthOf(ui.date); render(); break;
    case "goto": ui.date = b.dataset.k; ui.tab = b.dataset.tab; ui.open = null; saveUI(); render(); window.scrollTo(0, 0); break;

    // coach
    case "coach-q": sendCoach(COACH_PROMPTS[+b.dataset.i]); break;
    case "coach-send": { const v = $("#coach-in").value; $("#coach-in").value = ""; sendCoach(v); break; }
    case "coach-stop": coachAbort?.abort(); break;
    case "coach-clear": chat = []; lsSet(LS_CHAT, chat); render(); break;

    // settings
    case "copy-data": {
      const txt = JSON.stringify(S, null, 1);
      navigator.clipboard?.writeText(txt).then(() => toast("Copied to clipboard"), () => toast("Copy isn't allowed here")) ?? toast("Copy isn't allowed here");
      break;
    }
  }
});
function addFood(it, meal) {
  const d = day(ui.date);
  d.food.push({ id: uid(), meal: meal || "snacks", ...it });
  saveDay(ui.date); closeSheet(); render(); toast(`Added ${it.name}`);
}
async function aiEstimate() {
  const s = ui.sheet, text = $("#ai-food").value.trim(); s.text = text;
  if (!text) { toast("Describe the food first"); return; }
  s.busy = true; s.err = null; renderSheet();
  try {
    const r = await SAMPLE.json(`Estimate the nutrition of this food/meal as eaten, using typical portion sizes and standard nutrition databases (e.g. USDA, UK CoFID). Split it into separate items.
Food: """${text.slice(0, 1500)}"""
Reply with only JSON in exactly this shape: {"items":[{"name":"Scrambled eggs (2 large)","grams":120,"kcal":200,"p":14,"c":2,"f":15,"fib":0}]}
"p","c","f","fib" are grams of protein, carbohydrate, fat and fibre. Use numbers, not strings.`, { modelTier: "default" });
    const items = (r?.items || []).filter(i => i && i.name).map(i => ({ name: String(i.name).slice(0, 80), grams: +i.grams || null, kcal: +i.kcal || 0, p: +i.p || 0, c: +i.c || 0, f: +i.f || 0, fib: +i.fib || 0, on: true }));
    if (!items.length) throw { code: "empty" };
    s.items = items;
  } catch (e) { s.err = e?.code === "empty" || e?.code === "invalid_json" ? "Couldn't read that. Try describing it with amounts, e.g. “150 g chicken, 1 cup rice”." : sampleErr(e); }
  s.busy = false; if (ui.sheet === s) renderSheet();
}
async function aiTargets() {
  const s = ui.sheet; s.busy = true; s.err = null; renderSheet();
  try {
    const r = await SAMPLE.json(`${COACH_RULES}

=== USER DATA FROM THE APP ===
${coachContext()}
=== END DATA ===

Set this person's daily nutrition targets for their goal (lose love handles, reveal abs, build a broader frame while keeping or gaining muscle). Use their stats and recent weight and food trend if present. If key stats are missing, assume an average adult and say so in "why".
Reply with only JSON: {"kcal":2200,"p":170,"c":200,"f":70,"fib":32,"water":3000,"why":"One or two plain sentences explaining the numbers."}
Numbers are daily: kcal, grams of protein/carbs/fat/fibre, and water in ml.`, { modelTier: "default" });
    const ai = { kcal: Math.round(+r.kcal), p: Math.round(+r.p), c: Math.round(+r.c), f: Math.round(+r.f), fib: Math.round(+r.fib || 30), water: Math.round(+r.water || 2500), why: String(r.why || "").slice(0, 400) };
    if (!ai.kcal || !ai.p) throw { code: "invalid_json" };
    s.ai = ai;
  } catch (e) { s.err = e?.code === "invalid_json" ? "The coach's answer couldn't be read. Try again." : sampleErr(e); }
  s.busy = false; if (ui.sheet === s) renderSheet();
}

// inputs that save as you type (no re-render, so the keyboard stays open)
let woStatT = null;
document.addEventListener("input", e => {
  const t = e.target, s = ui.sheet;
  if (t.matches(".set-in")) {
    const wo = openWO(), row = t.closest(".set-row"); if (!wo) return;
    const st = wo.exercises[+row.dataset.ex].sets[+row.dataset.set], f = t.dataset.f, v = t.value.trim().replace(",", ".");
    st[f] = v === "" || isNaN(+v) ? null : (f === "w" ? wStore(v) : +v);
    saveDay(ui.open.date);
    clearTimeout(woStatT); woStatT = setTimeout(() => { const vEl = $("#wo-vol"); if (vEl) vEl.textContent = fmtInt(wDisp(woVolume(wo))); }, 200);
  } else if (t.dataset.exfield === "note") {
    const wo = openWO(); if (!wo) return; wo.exercises[+t.dataset.exi].note = t.value; saveDay(ui.open.date);
  } else if (t.dataset.wofield) {
    const wo = openWO(); if (!wo) return;
    if (t.dataset.wofield === "name") wo.name = t.value;
    else { const v = parseInt(t.value, 10); wo.dur = isNaN(v) ? null : v; }
    saveDay(ui.open.date);
  } else if (t.id === "pick-q") { s.q = t.value; $("#pick-list").innerHTML = pickerList(s); $("#sh-body").scrollTop = 0; }
  else if (t.id === "food-q") { s.q = t.value; $("#food-res").innerHTML = foodResults(s); }
  else if (t.id === "food-g") { const g = num("#food-g") || 0; s.g = g; $("#food-prev").innerHTML = foodPrev(scale(s.pick.per, g)); }
  else if (t.id === "ai-food") { s.text = t.value; }
  else if (t.id === "pf-h") { const h = num("#pf-h"); $("#pf-ftin").textContent = h ? `${Math.floor(h / 2.54 / 12)}′${Math.round(h / 2.54 % 12)}″` : ""; }
  else if (t.id === "coach-in") { t.style.height = "auto"; t.style.height = Math.min(140, t.scrollHeight) + "px"; }
});
document.addEventListener("change", e => {
  const t = e.target;
  if (t.dataset.exfield === "rest") { const wo = openWO(); wo.exercises[+t.dataset.exi].rest = +t.value; saveDay(ui.open.date); }
  else if (t.id === "pick-eq") { ui.sheet.eq = t.value; $("#pick-list").innerHTML = pickerList(ui.sheet); }
  else if (t.id === "set-units") { S.settings.units = t.value; saveProfile(); renderSheet(); render(); }
  else if (t.id === "set-rest") { S.settings.restDefault = +t.value; saveProfile(); }
  else if (t.id === "body-weight") {
    const d = day(ui.date), v = wStore(t.value.trim().replace(",", ".")); d.weight = v; saveDay(ui.date);
    if (v) { const latest = allDayKeysDesc().find(k => getDay(k).weight); if (latest === ui.date) { S.profile.weightKg = v; saveProfile(); } }
    toast(v ? "Weight logged" : "Weight cleared");
  }
  else if (t.id === "body-waist") { const d = day(ui.date); d.waist = num("#body-waist"); saveDay(ui.date); toast(d.waist ? "Waist logged" : "Waist cleared"); }
  else if (t.id === "food-meal" && ui.sheet) ui.sheet.meal = t.value;
});
document.addEventListener("keydown", e => {
  if (e.target.id === "coach-in" && e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); const v = e.target.value; e.target.value = ""; sendCoach(v); }
  if (e.key === "Escape" && ui.sheet) closeSheet();
});
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") { tick(); syncWakeLock(); } });

/* ============================== boot ============================== */
render();
setInterval(tick, 250);
initCaps();
</script>
